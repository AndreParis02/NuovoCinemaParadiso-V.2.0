<header class="navbar-shell">
  <div class="container navbar">
    <a routerLink="/dashboard" class="brand">Nuovo cinema Paradiso frontendv2</a>

    @if (isAutenticato()) {
      <nav class="links">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/tipologia-sala" routerLinkActive="active">Gestisci tipologie sala</a>
        @if (isGestore()) {
          <a routerLink="/admin/change-role" routerLinkActive="active">Cambio ruolo</a>
        }
      </nav>

      <div class="user-box">
        <div>
          <strong>{{ utente()?.nomeCompleto }}</strong>
          <div class="muted small">{{ utente()?.email }} - {{ utente()?.ruolo }}</div>
        </div>
        <button class="btn btn-secondary" type="button" (click)="logout()">Logout</button>
      </div>
    } @else {
      <nav class="links">
        <a routerLink="/login" routerLinkActive="active">Login</a>
        <a routerLink="/register" routerLinkActive="active">Registrazione</a>
      </nav>
    }
  </div>
</header>
