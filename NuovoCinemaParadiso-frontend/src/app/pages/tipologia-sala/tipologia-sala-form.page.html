<div>
    <h2>Form di Inserimento Tipologia Sala</h2>
    <form (ngSubmit)="ngSubmit()">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" [(ngModel)]="tipologiaSala.nome">
        </div>
        <div>
            <label for="maggiorazionePrezzo">Maggiorazione Prezzo:</label>
            <input type="number" id="maggiorazionePrezzo" [(ngModel)]="tipologiaSala.maggiorazionePrezzo">
        </div>
        <button type="submit">Salva</button>
    </form>
</div>
